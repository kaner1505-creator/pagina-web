<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postulaciones - Los Minecrafteros</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #082e0d 0%, #031405 100%);
      color: #e8ffe8;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .floating-earth {
      position: fixed; top: 25px; right: 35px; font-size: 3.5rem;
      filter: drop-shadow(0 0 15px #39ff14);
      animation: levitate 3s ease-in-out infinite;
    }
    @keyframes levitate {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }
    .shield-btn {
      position: fixed; top: 25px; left: 25px; width: 55px; height: 55px;
      background: #031405; border: 2px solid #39ff14; border-radius: 10px;
      box-shadow: 0 0 12px #39ff14; color: #39ff14; font-size: 1.7rem;
      display: flex; justify-content: center; align-items: center;
      text-decoration: none; transition: 0.2s;
    }
    .shield-btn:hover { background: rgba(57, 255, 20, 0.2); transform: scale(1.08); }
    .box {
      width: 90%; max-width: 700px; background: rgba(5, 28, 9, 0.95);
      border: 2px solid #39ff14; border-radius: 16px; padding: 45px 30px;
      text-align: center; box-shadow: 0 0 25px rgba(57, 255, 20, 0.35);
    }
    h1 { font-family: 'Orbitron', sans-serif; color: #39ff14; font-size: 2.2rem; margin-bottom: 20px; text-shadow: 0 0 10px #39ff14; }
    p { font-size: 1.25rem; line-height: 1.6; color: #c8f7c5; margin-bottom: 35px; }
    .btn {
      display: inline-block; text-decoration: none;
      color: #39ff14; font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 700;
      padding: 15px 32px; border: 2px solid #39ff14; border-radius: 8px;
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.5); transition: 0.2s;
    }
    .btn:hover { background: #39ff14; color: #021104; box-shadow: 0 0 28px #39ff14; }
  </style>
</head>
<body>
  <div class="floating-earth">🌍</div>
  <a href="login.html" class="shield-btn" title="Panel Staff">🛡️</a>

  <div class="box">
    <h1>POSTULACIONES<br>LOS MINECRAFTEROS</h1>
    <p>
      ¡Bienvenido al portal oficial de reclutamiento de <strong>Los Minecrafteros</strong>!<br>
      Buscamos personas responsables, activas y comprometidas para mantener el orden en nuestra comunidad.
    </p>
    <a href="postular.html" class="btn">CLICK AQUÍ PARA POSTULARSE</a>
  </div>
</body>
</html>
