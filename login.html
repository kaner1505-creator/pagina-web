<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Staff - Los Minecrafteros</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600;700&display=swap');
    body {
      background: radial-gradient(circle at center, #082e0d 0%, #031405 100%);
      color: #e8ffe8; font-family: 'Rajdhani', sans-serif;
      min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0;
    }
    .box {
      width: 90%; max-width: 420px; background: rgba(5, 28, 9, 0.95);
      border: 2px solid #39ff14; border-radius: 16px; padding: 35px;
      text-align: center; box-shadow: 0 0 25px rgba(57, 255, 20, 0.35);
    }
    h2 { font-family: 'Orbitron', sans-serif; color: #39ff14; margin-bottom: 15px; }
    input {
      width: 100%; box-sizing: border-box; background: #020f04; border: 1.5px solid #39ff14;
      border-radius: 8px; padding: 12px; color: #fff; font-size: 1.1rem; margin: 15px 0;
    }
    .btn {
      background: transparent; color: #39ff14; font-family: 'Orbitron', sans-serif;
      font-weight: 700; padding: 12px 25px; border: 2px solid #39ff14; border-radius: 8px; cursor: pointer;
    }
    .btn:hover { background: #39ff14; color: #000; }
    #err { color: #ff2a5f; font-weight: bold; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🛡️ ACCESO STAFF</h2>
    <p>Ingresa la contraseña:</p>
    <input type="password" id="pass" placeholder="Contraseña..." onkeypress="if(event.key==='Enter') entrar()">
    <div style="display:flex; gap:10px; justify-content:center;">
      <a href="index.html" class="btn" style="text-decoration:none;">Volver</a>
      <button class="btn" onclick="entrar()">Siguiente</button>
    </div>
    <p id="err">❌ Contraseña incorrecta</p>
  </div>

  <script>
    function entrar() {
      if (document.getElementById('pass').value === 'Los-MC-2026') {
        sessionStorage.setItem('staff_auth', 'ok');
        window.location.href = 'panel.html';
      } else {
        document.getElementById('err').style.display = 'block';
      }
    }
  </script>
</body>
</html>
