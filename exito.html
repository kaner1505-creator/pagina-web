<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postulación Enviada - Los Minecrafteros</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600;700&display=swap');
    body {
      background: radial-gradient(circle at center, #082e0d 0%, #031405 100%);
      color: #e8ffe8; font-family: 'Rajdhani', sans-serif;
      min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0;
    }
    .box {
      width: 90%; max-width: 600px; background: rgba(5, 28, 9, 0.95);
      border: 2px solid #39ff14; border-radius: 16px; padding: 45px 30px;
      text-align: center; box-shadow: 0 0 25px rgba(57, 255, 20, 0.35);
    }
    h1 { font-family: 'Orbitron', sans-serif; color: #39ff14; margin: 15px 0; text-shadow: 0 0 10px #39ff14; }
    p { font-size: 1.25rem; color: #c8f7c5; }
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size: 4rem;">✅</div>
    <h1>¡POSTULACIÓN ENVIADA CON ÉXITO!</h1>
    <p>Tus respuestas quedaron guardadas. <strong>Ya puedes cerrar esta ventana.</strong></p>
  </div>
</body>
</html>
